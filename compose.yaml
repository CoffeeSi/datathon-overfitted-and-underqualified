services:
  backend:
    # Host ML owns port 8000 by default; container backend is explicit opt-in.
    profiles: [container-backend]
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.compose
    environment:
      FORTEBANK_DATA_DIR: /app/data/service
      FORTEBANK_MAX_UPLOAD_MB: "100"
      FORTEBANK_ENABLE_MOCK_RESULTS: "false"
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data/service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.compose
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      MAX_UPLOAD_MB: "100"
      DEMO_ENABLED: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  backend-data:
